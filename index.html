<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/template.css">
    <title>Arquitetura</title>
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">
                <img src="assets/images/hibisco.png" alt="Logo">
            </div>
            <nav>
                <ul class="menu">
                    <li><a href="">News</a></li>
                    <li><a href="">Houses</a></li>
                    <li><a href="">Buildings</a></li>
                    <li><a href="">Hotels</a></li>
                    <li><a href="">Commercial</a></li>
                    <li><a href="">Interiors</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
            </nav>
            <div class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>
    <main>

        <section class="news layout">
            <div class="news-image">
                <img src="assets/images/news.png" alt="News">
            </div>
        </section>

        <section class="houses layout">
            <div class="houses-image">
                <a href="#"><img src="assets/images/house-color.jpg" alt="Houses"></a>
            </div>
        </section>

        <section class="buildings layout">
            <div class="buildings-image">
                <a href="#"><img src="assets/images/buildings-color.jpg" alt="Buildings"></a>
            </div>
        </section>

        <section class="hotels layout">
            <div class="hotels-image">
                <a href="#"><img src="assets/images/hotel-color.jpg" alt="Hotels"></a>
            </div>
        </section>

        <section class="commercial layout">
            <div class="commercial-image">
                <a href="#"><img src="assets/images/mall-color.jpg" alt="Commercial"></a>
            </div>
        </section>

        <section class="interiors layout">
            <div class="interiors-image">
                <a href="#"><img src="assets/images/interiors-color.jpg" alt="Interiors"></a>
            </div>
        </section>


    </main>
    
</body>
</html>
